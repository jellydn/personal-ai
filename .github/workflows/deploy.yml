name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify catalog and README parity
        run: node scripts/check-catalog-parity.js
      - name: Verify category config completeness
        run: node scripts/check-category-config.js
      - name: Verify demo links are live
        run: node scripts/check-demo-links.js
      - name: Verify theme toggle behavior
        run: node scripts/check-theme-toggle.js
      - name: Verify lightbox and mobile nav behavior
        run: node scripts/check-showcase-interactions.js
      - name: Verify JSON-LD structured data
        run: node scripts/check-json-ld.js
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
